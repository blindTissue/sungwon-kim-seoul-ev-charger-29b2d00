openapi: 3.1.0
info:
  title: Seoul EV Charger Finder API
  version: 1.0.0
  description: |
    Contract between the mobile app and the backend. The MVP backend is a mock
    (simulated availability, SQLite). A production backend must implement this
    same contract so the app keeps working unchanged.

    Conventions
    - All coordinates are WGS84 decimal degrees.
    - All timestamps are ISO-8601 UTC strings.
    - Distances are metres, durations are seconds, prices are KRW.
    - Every bilingual text field comes as a `_ko` / `_en` pair.
    - Errors always use the `Error` shape with `code`, `message_ko`, `message_en`.
    - Reservation endpoints identify the caller with the `X-Device-Id` header
      (anonymous UUID generated by the app on first launch).
servers:
  - url: http://localhost:3000
    description: Local mock backend (docker compose)

tags:
  - name: stations
  - name: districts
  - name: reservations
  - name: proxy
    description: Server-side proxies for Kakao APIs (keys never reach the app)
  - name: debug
    description: Demo-only endpoints, enabled when DEBUG_ENDPOINTS=true

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and provider configuration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /stations:
    get:
      operationId: listStations
      tags: [stations]
      summary: Nearby stations with availability summary, sorted by distance
      parameters:
        - { $ref: "#/components/parameters/Lat" }
        - { $ref: "#/components/parameters/Lng" }
        - name: radius_m
          in: query
          schema: { type: integer, minimum: 100, maximum: 20000, default: 3000 }
        - { $ref: "#/components/parameters/Speed" }
        - { $ref: "#/components/parameters/Connector" }
        - name: available_only
          in: query
          description: Only stations with at least one available charger matching the filters.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationList" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /stations/nearest:
    get:
      operationId: getNearestStations
      tags: [stations]
      summary: Best stations ranked by driving ETA (top 3)
      description: |
        Takes the 10 stations nearest to (`lat`,`lng`) by straight-line distance
        that have at least one available charger matching the filters, computes a
        driving route from (`origin_lat`,`origin_lng`) to each, and returns the
        top 3 by ETA. If no origin is given (location unknown), results are ranked
        by straight-line distance and `route` is null.
      parameters:
        - { $ref: "#/components/parameters/Lat" }
        - { $ref: "#/components/parameters/Lng" }
        - name: origin_lat
          in: query
          schema: { type: number }
        - name: origin_lng
          in: query
          schema: { type: number }
        - { $ref: "#/components/parameters/Speed" }
        - { $ref: "#/components/parameters/Connector" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /stations/{id}:
    get:
      operationId: getStation
      tags: [stations]
      summary: Station detail including every charger
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /districts:
    get:
      operationId: listDistricts
      tags: [districts]
      summary: Per-district availability summary (all 25 자치구)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictList" }

  /districts/{code}/stations:
    get:
      operationId: listDistrictStations
      tags: [districts]
      summary: All stations in a district (no availability filter)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: "11680" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistrictStations" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reservations:
    post:
      operationId: createReservation
      tags: [reservations]
      summary: Reserve a charger for 10 minutes
      description: |
        Rules: one active reservation per device; 15-minute cooldown after a
        no-show expiry; driving ETA from the origin must be <= 10 minutes (if no
        origin is sent the reservation is allowed and the app shows a warning).
        Creation is atomic: when two devices race for one charger exactly one
        gets 201 and the other gets 409 `ALREADY_RESERVED`.
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReservationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`ALREADY_RESERVED`, `CHARGER_UNAVAILABLE` or `ACTIVE_RESERVATION_EXISTS`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`ETA_TOO_LONG`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`COOLDOWN_ACTIVE` (see `details.cooldown_until`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reservations/active:
    get:
      operationId: getActiveReservation
      tags: [reservations]
      summary: The calling device's active reservation (and cooldown, if any)
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200":
          description: OK. `reservation` is null when the device has none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveReservationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /reservations/{id}/cancel:
    post:
      operationId: cancelReservation
      tags: [reservations]
      summary: Cancel; the charger becomes available immediately, no penalty
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/ReservationId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`RESERVATION_NOT_ACTIVE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reservations/{id}/arrive:
    post:
      operationId: arriveReservation
      tags: [reservations]
      summary: Driver arrived; the charger switches to `charging`
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/ReservationId" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`RESERVATION_NOT_ACTIVE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /places/search:
    get:
      operationId: searchPlaces
      tags: [proxy]
      summary: Keyword place search limited to Seoul (Kakao Local or mock)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /route:
    get:
      operationId: getRoute
      tags: [proxy]
      summary: Car route summary (Kakao Mobility or mock)
      parameters:
        - name: from
          in: query
          required: true
          description: "`lat,lng`"
          schema: { type: string, example: "37.4979,127.0276" }
        - name: to
          in: query
          required: true
          description: "`lat,lng`"
          schema: { type: string, example: "37.5007,127.0365" }
        - name: geometry
          in: query
          required: false
          description: When true, include the driving route polyline as `path` (for the in-app route preview).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /map:
    get:
      operationId: getMapPage
      tags: [proxy]
      summary: HTML map page loaded by the app's WebView (Kakao Maps or mock tiles)
      description: |
        The page talks to the app with JSON messages, see `MapInboundMessage`
        (app -> page) and `MapOutboundMessage` (page -> app).
      parameters:
        - name: lang
          in: query
          schema: { type: string, enum: [ko, en] }
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema: { type: string }

  /debug/chargers/{id}/status:
    post:
      operationId: debugSetChargerStatus
      tags: [debug]
      summary: Force a charger's status (cannot override an active reservation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [available, charging, out_of_order, unknown]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charger" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /debug/reservations/{id}/fast-forward:
    post:
      operationId: debugFastForwardReservation
      tags: [debug]
      summary: "Move a reservation's expiry forward (default: expire now)"
      parameters:
        - { $ref: "#/components/parameters/ReservationId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seconds:
                  type: integer
                  minimum: 1
                  description: Seconds to subtract from the remaining time. Omit to expire immediately.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /debug/devices/{deviceId}/cooldown:
    delete:
      operationId: debugClearCooldown
      tags: [debug]
      summary: Clear a device's no-show cooldown
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Cleared }

  /debug/reset:
    post:
      operationId: debugReset
      tags: [debug]
      summary: Reset all stations, chargers and reservations to the seed state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorState" }

  /debug/simulator:
    get:
      operationId: debugGetSimulator
      tags: [debug]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorState" }
    post:
      operationId: debugSetSimulator
      tags: [debug]
      summary: Set the simulator speed multiplier and/or run one tick now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                speed: { type: number, minimum: 0, maximum: 1000 }
                tick: { type: boolean, description: Run one simulator tick immediately }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulatorState" }

components:
  parameters:
    Lat:
      name: lat
      in: query
      required: true
      schema: { type: number, minimum: -90, maximum: 90 }
    Lng:
      name: lng
      in: query
      required: true
      schema: { type: number, minimum: -180, maximum: 180 }
    Speed:
      name: speed
      in: query
      description: Charger speed filter; omit for both.
      schema: { $ref: "#/components/schemas/ChargerSpeed" }
    Connector:
      name: connector
      in: query
      description: Comma-separated connector types; omit for all.
      schema: { type: string, example: "DC_COMBO,CHADEMO" }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64 }
    ReservationId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: "`VALIDATION_ERROR` or `MISSING_DEVICE_ID`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`NOT_FOUND`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: "`UPSTREAM_ERROR` (Kakao API failed)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message_ko, message_en]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message_ko: { type: string }
        message_en: { type: string }
        details:
          type: object
          additionalProperties: true
          description: |
            Machine-readable extras. `ETA_TOO_LONG`: `eta_s`, `max_eta_s`.
            `COOLDOWN_ACTIVE`: `cooldown_until`. `ALREADY_RESERVED`: `expires_at`.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - MISSING_DEVICE_ID
        - NOT_FOUND
        - ETA_TOO_LONG
        - ALREADY_RESERVED
        - CHARGER_UNAVAILABLE
        - COOLDOWN_ACTIVE
        - ACTIVE_RESERVATION_EXISTS
        - RESERVATION_NOT_ACTIVE
        - UPSTREAM_ERROR
        - INTERNAL_ERROR

    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    Health:
      type: object
      required: [ok, providers, debug_endpoints, server_time]
      properties:
        ok: { type: boolean }
        server_time: { type: string, format: date-time }
        debug_endpoints: { type: boolean }
        providers:
          type: object
          required: [routing, places, map]
          properties:
            routing: { type: string, enum: [kakao, mock] }
            places: { type: string, enum: [kakao, mock] }
            map: { type: string, enum: [kakao, mock] }

    ChargerSpeed:
      type: string
      enum: [DC, AC]
    ConnectorType:
      type: string
      enum: [DC_COMBO, CHADEMO, AC_TYPE1, AC3]
    ChargerStatus:
      type: string
      enum: [available, charging, reserved, out_of_order, unknown]
    MarkerStatus:
      type: string
      description: "available: >=1 available; reserved: none available but >=1 reserved; unavailable: otherwise"
      enum: [available, reserved, unavailable]
    LotType:
      type: string
      enum: [public, semi_public]
    SiteType:
      type: string
      enum: [public_parking, transfer_parking, park, gov_office, community_center, retail]

    ChargerReservationInfo:
      type: object
      description: Public view of a reservation on a charger (no device identity).
      required: [expires_at, remaining_s]
      properties:
        expires_at: { type: string, format: date-time }
        remaining_s: { type: integer, minimum: 0 }

    Charger:
      type: object
      required: [id, station_id, speed, connector, power_kw, price_per_kwh_krw, status, status_updated_at, reservation]
      properties:
        id: { type: string }
        station_id: { type: string }
        speed: { $ref: "#/components/schemas/ChargerSpeed" }
        connector: { $ref: "#/components/schemas/ConnectorType" }
        power_kw: { type: number }
        price_per_kwh_krw: { type: number }
        status: { $ref: "#/components/schemas/ChargerStatus" }
        status_updated_at: { type: string, format: date-time }
        reservation:
          oneOf:
            - { $ref: "#/components/schemas/ChargerReservationInfo" }
            - { type: "null" }

    AvailabilitySummary:
      type: object
      required: [total, available, reserved, charging, out_of_order, unknown, dc_total, dc_available, ac_total, ac_available]
      properties:
        total: { type: integer }
        available: { type: integer }
        reserved: { type: integer }
        charging: { type: integer }
        out_of_order: { type: integer }
        unknown: { type: integer }
        dc_total: { type: integer }
        dc_available: { type: integer }
        ac_total: { type: integer }
        ac_available: { type: integer }

    StationBase:
      type: object
      required: [id, name_ko, name_en, address_ko, address_en, district_code, lat, lng, lot_type, site_type]
      properties:
        id: { type: string }
        name_ko: { type: string }
        name_en: { type: string }
        address_ko: { type: string }
        address_en: { type: string }
        district_code: { type: string }
        lat: { type: number }
        lng: { type: number }
        lot_type: { $ref: "#/components/schemas/LotType" }
        site_type: { $ref: "#/components/schemas/SiteType" }

    StationSummary:
      description: A station in list / map results.
      allOf:
        - { $ref: "#/components/schemas/StationBase" }
        - type: object
          required: [summary, marker_status, available_matching, connectors, max_power_kw, distance_m]
          properties:
            summary: { $ref: "#/components/schemas/AvailabilitySummary" }
            marker_status: { $ref: "#/components/schemas/MarkerStatus" }
            available_matching:
              type: integer
              description: Available chargers that match the request's speed/connector filters.
            connectors:
              type: array
              items: { $ref: "#/components/schemas/ConnectorType" }
            max_power_kw: { type: number }
            distance_m:
              type: ["number", "null"]
              description: Straight-line distance from the search point; null when there is no search point.

    StationDetail:
      allOf:
        - { $ref: "#/components/schemas/StationSummary" }
        - type: object
          required: [operator_note_ko, operator_note_en, open_hours, parking_fee_note_ko, parking_fee_note_en, chargers]
          properties:
            operator_note_ko: { type: string }
            operator_note_en: { type: string }
            open_hours:
              type: string
              description: "`HH:MM-HH:MM` in 24-hour local time; `00:00-24:00` means open 24 hours."
              example: "00:00-24:00"
            parking_fee_note_ko: { type: string }
            parking_fee_note_en: { type: string }
            chargers:
              type: array
              items: { $ref: "#/components/schemas/Charger" }

    StationList:
      type: object
      required: [stations, center, radius_m]
      properties:
        center: { $ref: "#/components/schemas/LatLng" }
        radius_m: { type: integer }
        stations:
          type: array
          items: { $ref: "#/components/schemas/StationSummary" }

    RouteSummary:
      type: object
      required: [distance_m, duration_s, provider]
      properties:
        distance_m: { type: number }
        duration_s: { type: number }
        provider: { type: string, enum: [kakao, mock] }
        path:
          description: |
            Only present when requested with `geometry=true`. Driving route polyline as `[lat, lng]`
            pairs from origin to destination (Kakao: sections[].roads[].vertexes; mock: a simple
            street-grid style polyline). Display only; no turn-by-turn data.
          type: array
          items: { $ref: "#/components/schemas/PathPoint" }

    PathPoint:
      description: "`[lat, lng]`"
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number }

    NearestItem:
      type: object
      required: [station, route]
      properties:
        station: { $ref: "#/components/schemas/StationSummary" }
        route:
          oneOf:
            - { $ref: "#/components/schemas/RouteSummary" }
            - { type: "null" }

    NearestResult:
      type: object
      required: [results, searched, ranked_by]
      properties:
        searched: { type: integer, description: Number of candidate stations routed (max 10). }
        ranked_by: { type: string, enum: [eta, distance] }
        results:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/NearestItem" }

    District:
      type: object
      required: [code, name_ko, name_en, center, bbox, station_count, summary]
      properties:
        code: { type: string }
        name_ko: { type: string }
        name_en: { type: string }
        center: { $ref: "#/components/schemas/LatLng" }
        bbox:
          type: object
          required: [south, west, north, east]
          properties:
            south: { type: number }
            west: { type: number }
            north: { type: number }
            east: { type: number }
        station_count: { type: integer }
        summary: { $ref: "#/components/schemas/AvailabilitySummary" }

    DistrictList:
      type: object
      required: [districts]
      properties:
        districts:
          type: array
          items: { $ref: "#/components/schemas/District" }

    DistrictStations:
      type: object
      required: [district, stations]
      properties:
        district: { $ref: "#/components/schemas/District" }
        stations:
          type: array
          items: { $ref: "#/components/schemas/StationSummary" }

    ReservationState:
      type: string
      enum: [active, arrived, cancelled, expired]

    Reservation:
      type: object
      required: [id, charger_id, station_id, device_id, created_at, expires_at, state]
      properties:
        id: { type: string }
        charger_id: { type: string }
        station_id: { type: string }
        device_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/ReservationState" }
        ended_at:
          type: ["string", "null"]
          format: date-time

    ReservationEnvelope:
      type: object
      required: [reservation, server_time]
      properties:
        reservation: { $ref: "#/components/schemas/Reservation" }
        station:
          $ref: "#/components/schemas/StationBase"
        server_time:
          type: string
          format: date-time
          description: Lets the app correct its local countdown for clock skew.

    ActiveReservationResponse:
      type: object
      required: [reservation, station, cooldown_until, server_time]
      properties:
        reservation:
          oneOf:
            - { $ref: "#/components/schemas/Reservation" }
            - { type: "null" }
        station:
          oneOf:
            - { $ref: "#/components/schemas/StationBase" }
            - { type: "null" }
        cooldown_until:
          type: ["string", "null"]
          format: date-time
        last_ended:
          description: The device's most recent reservation if it ended in the last 2 minutes (lets the app show an expiry alert).
          oneOf:
            - { $ref: "#/components/schemas/Reservation" }
            - { type: "null" }
        server_time: { type: string, format: date-time }

    CreateReservationRequest:
      type: object
      required: [charger_id]
      properties:
        charger_id: { type: string }
        origin_lat: { type: number }
        origin_lng: { type: number }

    Place:
      type: object
      required: [id, name_ko, name_en, address_ko, address_en, lat, lng]
      properties:
        id: { type: string }
        name_ko: { type: string }
        name_en: { type: string, description: Same as name_ko when the provider has no English name. }
        address_ko: { type: string }
        address_en: { type: string }
        lat: { type: number }
        lng: { type: number }

    PlaceSearchResult:
      type: object
      required: [places, provider]
      properties:
        provider: { type: string, enum: [kakao, mock] }
        places:
          type: array
          items: { $ref: "#/components/schemas/Place" }

    SimulatorState:
      type: object
      required: [speed, seed, tick_interval_s, sim_time, ticks]
      properties:
        speed: { type: number }
        seed: { type: integer }
        tick_interval_s: { type: number }
        sim_time: { type: string, format: date-time }
        ticks: { type: integer }

    MapMarker:
      type: object
      required: [id, lat, lng, status, label]
      properties:
        id: { type: string }
        lat: { type: number }
        lng: { type: number }
        status: { $ref: "#/components/schemas/MarkerStatus" }
        label: { type: string, description: Short text drawn on the marker (available count). }
        a11y: { type: string, description: Screen-reader label. }
        selected: { type: boolean }

    MapInboundMessage:
      description: Message sent by the app into the map page.
      oneOf:
        - type: object
          required: [type, markers]
          properties:
            type: { const: setMarkers }
            markers: { type: array, items: { $ref: "#/components/schemas/MapMarker" } }
        - type: object
          required: [type, lat, lng]
          properties:
            type: { const: setCenter }
            lat: { type: number }
            lng: { type: number }
            zoom: { type: number, description: "Approximate web-map zoom level (higher = closer)" }
        - type: object
          required: [type, bbox]
          properties:
            type: { const: fitBounds }
            bbox:
              type: object
              required: [south, west, north, east]
              properties:
                south: { type: number }
                west: { type: number }
                north: { type: number }
                east: { type: number }
        - type: object
          required: [type]
          properties:
            type: { const: setUserLocation }
            lat: { type: ["number", "null"] }
            lng: { type: ["number", "null"] }
        - type: object
          required: [type]
          description: >
            Shows the search pin at a position, or hides it when `lat` is null. The pin is not
            draggable; a tap on the map posts `mapClick` and the app sends a new `setPin`.
          properties:
            type: { const: setPin }
            lat: { type: ["number", "null"] }
            lng: { type: ["number", "null"] }
            a11y: { type: string, description: "Screen-reader label for the pin." }
        - type: object
          required: [type, radius_m]
          properties:
            type: { const: setRadius }
            radius_m: { type: number }
            lat: { type: number }
            lng: { type: number }
        - type: object
          required: [type, path]
          description: Draws the route polyline (replacing any previous one), or clears it when `path` is null.
          properties:
            type: { const: setRoute }
            path:
              oneOf:
                - { type: array, items: { $ref: "#/components/schemas/PathPoint" } }
                - { type: "null" }
            fit: { type: boolean, description: Fit the viewport to the route. }
        - type: object
          required: [type, districts]
          description: >
            Colors the 25 Seoul 자치구. Geometry is not in the message; the page loads
            `/static/geo/seoul-districts.geojson` and joins it on `code` (`SIG_CD`).
            An empty `districts` array clears the polygons. `fit` fits the viewport to them.
          properties:
            type: { const: setDistricts }
            fit: { type: boolean }
            districts:
              type: array
              items:
                type: object
                required: [code, status]
                properties:
                  code: { type: string }
                  status: { type: string, enum: [available, reserved, unavailable] }
                  a11y: { type: string, description: Screen-reader label for the polygon. }
                  selected: { type: boolean }

    MapOutboundMessage:
      description: Message posted by the map page to the app.
      oneOf:
        - type: object
          required: [type, provider]
          properties:
            type: { const: ready }
            provider: { type: string, enum: [kakao, mock] }
        - type: object
          required: [type, id]
          properties:
            type: { const: markerPress }
            id: { type: string }
        - type: object
          required: [type, lat, lng]
          properties:
            type: { const: longPress }
            lat: { type: number }
            lng: { type: number }
        - type: object
          required: [type, lat, lng]
          properties:
            type: { const: regionChange }
            lat: { type: number }
            lng: { type: number }
        - type: object
          required: [type, code]
          description: The user tapped a district polygon.
          properties:
            type: { const: districtPress }
            code: { type: string }
        - type: object
          required: [type, lat, lng]
          description: A short tap on the map. Does not by itself start a search.
          properties:
            type: { const: mapClick }
            lat: { type: number }
            lng: { type: number }
        - type: object
          required: [type, message]
          properties:
            type: { const: error }
            message: { type: string }
